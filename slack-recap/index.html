---
layout: null
sitemap: false
---
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Slack Recap</title>
<style>
  :root{
    --bg:#111827;
    --surface:#1f2937;
    --surface-hover:#263244;
    --border:#374151;
    --text:#f9fafb;
    --muted:#9ca3af;
    --accent:#3b82f6;
    --accent-hover:#2563eb;
    --ok:#4fa97c;
    --err:#e05c48;
    --radius:0.5rem;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:24px 16px 60px;
  }
  .wrap{max-width:640px;margin:0 auto}
  h1{font-size:1.5rem;font-weight:800;margin:0 0 4px}
  .subtitle{color:var(--muted);font-size:0.9rem;margin:0 0 28px}

  .field{margin-bottom:20px}
  label{
    display:block;font-size:0.8rem;font-weight:600;letter-spacing:.04em;
    text-transform:uppercase;color:var(--muted);margin-bottom:8px;
  }
  input[type="date"]{
    background:var(--surface);color:var(--text);border:1px solid var(--border);
    border-radius:var(--radius);padding:10px 12px;font-size:1rem;width:100%;
  }

  .channels{
    display:flex;flex-direction:column;gap:8px;
    background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius);padding:12px 14px;
  }
  .channel-row{display:flex;align-items:center;gap:10px;font-size:0.95rem}
  .channel-row input{width:18px;height:18px;accent-color:var(--accent)}

  button{
    font-family:inherit;cursor:pointer;border:none;border-radius:var(--radius);
  }
  .run-btn{
    width:100%;background:var(--accent);color:#fff;font-weight:700;
    font-size:1rem;padding:14px;margin-top:4px;
  }
  .run-btn:hover:not(:disabled){background:var(--accent-hover)}
  .run-btn:disabled{opacity:0.6;cursor:default}

  .status{margin-top:14px;font-size:0.9rem;min-height:1.2em}
  .status.error{color:var(--err)}
  .status.ok{color:var(--ok)}

  .result{margin-top:24px}
  textarea{
    width:100%;min-height:180px;background:var(--surface);color:var(--text);
    border:1px solid var(--border);border-radius:var(--radius);
    padding:14px;font-size:0.95rem;line-height:1.5;font-family:inherit;
    resize:vertical;
  }
  .copy-btn{
    margin-top:10px;background:transparent;color:var(--muted);
    border:1px solid var(--border);padding:9px 16px;font-size:0.85rem;
  }
  .copy-btn:hover{color:var(--text);border-color:var(--muted)}
  .copy-btn.copied{color:var(--ok);border-color:var(--ok)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Slack Recap</h1>
  <p class="subtitle">Pull today's channel activity and get a short recap to post in #announcements.</p>

  <div class="field">
    <label for="date">Date</label>
    <input type="date" id="date">
  </div>

  <div class="field">
    <label>Channels</label>
    <div class="channels" id="channels">
      <!-- Replace these IDs with real Slack channel IDs once the Slack App is set up -->
      <label class="channel-row"><input type="checkbox" value="PLACEHOLDER_1" checked> #general</label>
      <label class="channel-row"><input type="checkbox" value="PLACEHOLDER_2" checked> #build-log</label>
      <label class="channel-row"><input type="checkbox" value="PLACEHOLDER_3" checked> #programming</label>
      <label class="channel-row"><input type="checkbox" value="PLACEHOLDER_4"> #announcements</label>
      <label class="channel-row"><input type="checkbox" value="PLACEHOLDER_5"> #drive-team</label>
    </div>
  </div>

  <button class="run-btn" id="run">Generate Recap</button>
  <div class="status" id="status"></div>

  <div class="result" id="result" style="display:none">
    <label for="summary">Summary</label>
    <textarea id="summary" readonly></textarea>
    <button class="copy-btn" id="copy">Copy to Clipboard</button>
  </div>
</div>

<script>
// Set this to your home server's Tailscale MagicDNS HTTPS URL once it's running,
// e.g. "https://your-machine-name.your-tailnet.ts.net"
const BACKEND_URL = "https://CHANGE-ME.your-tailnet.ts.net";

const dateEl = document.getElementById("date");
const runBtn = document.getElementById("run");
const statusEl = document.getElementById("status");
const resultEl = document.getElementById("result");
const summaryEl = document.getElementById("summary");
const copyBtn = document.getElementById("copy");

// Default the date picker to today
dateEl.value = new Date().toISOString().slice(0, 10);

function setStatus(msg, kind) {
  statusEl.textContent = msg;
  statusEl.className = "status" + (kind ? " " + kind : "");
}

runBtn.addEventListener("click", async () => {
  const channels = Array.from(document.querySelectorAll("#channels input:checked")).map(c => c.value);
  if (!channels.length) {
    setStatus("Select at least one channel.", "error");
    return;
  }

  runBtn.disabled = true;
  runBtn.textContent = "Generating…";
  resultEl.style.display = "none";
  setStatus("Fetching messages and summarizing…");

  try {
    const res = await fetch(BACKEND_URL + "/api/recap", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ date: dateEl.value, channels })
    });

    if (!res.ok) {
      const text = await res.text();
      throw new Error(text || ("Server returned " + res.status));
    }

    const summary = await res.text();
    summaryEl.value = summary;
    resultEl.style.display = "block";
    setStatus("Done.", "ok");
  } catch (err) {
    setStatus("Couldn't generate a recap: " + err.message, "error");
  } finally {
    runBtn.disabled = false;
    runBtn.textContent = "Generate Recap";
  }
});

copyBtn.addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText(summaryEl.value);
    copyBtn.textContent = "Copied!";
    copyBtn.classList.add("copied");
    setTimeout(() => {
      copyBtn.textContent = "Copy to Clipboard";
      copyBtn.classList.remove("copied");
    }, 1500);
  } catch (err) {
    setStatus("Couldn't copy automatically — select the text and copy manually.", "error");
  }
});
</script>
</body>
</html>
