<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>{{ page.title }} | {{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <nav>
    <div class="nav-inner">
      <a href="{{ '/' | relative_url }}" class="nav-brand">{{ site.title }}</a>
      <ul class="nav-links">
        <li><a href="{{ '/' | relative_url }}">Home</a></li>
        <li><a href="{{ '/faq/' | relative_url }}">FAQ</a></li>
        <li><a href="{{ '/portfolio/' | relative_url }}">Portfolio</a></li>
      </ul>
    </div>
  </nav>
  <main>
    <div class="class-header">
      {% unless page.url == '/classes/' %}
      <a class="back-link" href="{{ '/classes/' | relative_url }}">&larr; All Classes</a>
      {% endunless %}
      <h1>{{ page.title }}</h1>
    </div>
    {{ content }}
  </main>
  <footer>
    <div class="footer-inner">
      <p>&copy; {{ site.time | date: "%Y" }} {{ site.author }}. All rights reserved.</p>
    </div>
  </footer>
</body>
</html>
