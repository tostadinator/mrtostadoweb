<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Battle Map — Daggerheart</title>
<style>
  body {
    margin: 0;
    font-family: 'Georgia', serif;
    background: #0a0712;
    color: #e8e2f5;
    padding: 16px;
  }
  .back-link { display: inline-block; color: #9b8bbf; font-size: 13px; text-decoration: none; margin-bottom: 12px; }
  .back-link:hover { color: #c9a8ff; }
  h1 { text-align: center; color: #c9a8ff; font-size: 24px; margin: 0 0 8px; }
  .sync-status { text-align: center; font-size: 12px; color: #7fdca0; margin-bottom: 10px; min-height: 16px; }
  .sync-status.error { color: #ff8a8a; }

  .controls {
    max-width: 900px; margin: 0 auto 12px; display: flex; gap: 8px;
    flex-wrap: wrap; justify-content: center;
  }
  .controls input[type="text"] {
    flex: 1; min-width: 200px; padding: 8px; border-radius: 8px;
    border: 2px solid #5b3e96; background: #1a1428; color: #e8e2f5;
  }
  .controls button {
    background: linear-gradient(135deg, #5b3e96, #8a5fc9); color: white;
    border: none; border-radius: 8px; padding: 8px 14px; cursor: pointer; font-size: 13px;
  }
  .controls button.danger { background: linear-gradient(135deg, #963e3e, #c96060); }

  .map-wrap {
    max-width: 900px; margin: 0 auto;
    position: relative; border: 2px solid #5b3e96; border-radius: 12px; overflow: hidden;
    background: #14102080;
    background-image:
      linear-gradient(0deg, rgba(91,62,150,0.15) 1px, transparent 1px),
      linear-gradient(90deg, rgba(91,62,150,0.15) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  .map-bg { width: 100%; display: block; pointer-events: none; }
  .map-canvas { position: relative; width: 100%; height: 600px; }
  .token {
    position: absolute; width: 48px; height: 48px; border-radius: 50%;
    border: 3px solid #c9a8ff; background: #3a2a5c;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: bold; color: #fff;
    cursor: grab; box-shadow: 0 0 10px rgba(170,120,255,0.5);
    user-select: none; touch-action: none;
  }
  .token.enemy { border-color: #e3a0a0; background: #5c2a2a; }
  .token:active { cursor: grabbing; }
  .token-label {
    position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%);
    font-size: 10px; white-space: nowrap; color: #c9a8ff;
  }
  .token.enemy .token-label { color: #e3a0a0; }

  .legend { max-width: 900px; margin: 10px auto; font-size: 12px; color: #9b8bbf; text-align: center; }

  /* Password gate */
  #auth-gate {
    position: fixed; inset: 0; z-index: 9999;
    background: radial-gradient(circle at top, #1b1330, #0a0712);
    display: flex; align-items: center; justify-content: center;
  }
  .gate-box { text-align: center; max-width: 320px; width: 100%; padding: 32px; }
  .gate-title { font-size: 32px; color: #c9a8ff; margin-bottom: 4px; }
  .gate-sub { font-size: 14px; color: #9b8bbf; margin-bottom: 28px; }
  .gate-input {
    width: 100%; box-sizing: border-box; padding: 12px 16px;
    border-radius: 10px; border: 2px solid #5b3e96;
    background: #1a1428; color: #e8e2f5; font-size: 16px;
    outline: none; margin-bottom: 12px;
  }
  .gate-input:focus { border-color: #c9a8ff; }
  .gate-btn {
    width: 100%; padding: 12px; border-radius: 10px; border: none;
    background: linear-gradient(135deg, #5b3e96, #8a5fc9);
    color: white; font-size: 15px; font-weight: bold; cursor: pointer;
  }
  .gate-error { color: #ff8a8a; font-size: 13px; margin-top: 10px; min-height: 18px; }
</style>
</head>
<body>

<div id="auth-gate">
  <div class="gate-box">
    <div class="gate-title">⚔️ Daggerheart</div>
    <div class="gate-sub">Battle Map</div>
    <input class="gate-input" id="pw-input" type="password" placeholder="Team password" autocomplete="current-password">
    <button class="gate-btn" id="pw-btn">Enter</button>
    <div class="gate-error" id="pw-error"></div>
  </div>
</div>

<a href="../" class="back-link">← Back to Home</a>
<h1>Battle Map</h1>
<div class="sync-status" id="sync-status">Connecting...</div>

<div class="controls">
  <input type="text" id="bg-url" placeholder="Paste a map image URL (optional)" value="https://i.redd.it/g39kbyrmglpc1.jpeg">
  <button id="set-bg-btn">Set Background</button>
  <button id="load-party-btn">⚔️ Load Party</button>
  <button id="add-token-btn">+ Add Player</button>
  <button id="add-enemy-btn">+ Add Enemy</button>
  <button id="clear-btn" class="danger">Clear Map</button>
</div>

<div class="map-wrap" id="map-wrap">
  <img id="map-bg" class="map-bg" src="" alt="" style="display:none;">
  <div class="map-canvas" id="map-canvas"></div>
</div>

<div class="legend">Drag tokens to move them — positions sync live to everyone viewing this page.</div>

<script>
  const PASSWORD_HASH = "5bfa0151f57207a3c1688bebe2568444a943842d5e7c42b7d4d0742b6f12baa1";

  async function sha256(msg) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(msg));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,"0")).join("");
  }

  async function checkAuth() {
    const stored = localStorage.getItem("dh_auth");
    if (stored === PASSWORD_HASH) { unlock(); return; }
    document.getElementById("pw-btn").addEventListener("click", attemptLogin);
    document.getElementById("pw-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter") attemptLogin();
    });
  }

  async function attemptLogin() {
    const val = document.getElementById("pw-input").value;
    const hash = await sha256(val);
    if (hash === PASSWORD_HASH) {
      localStorage.setItem("dh_auth", hash);
      unlock();
    } else {
      document.getElementById("pw-error").textContent = "Wrong password — try again.";
      document.getElementById("pw-input").value = "";
      document.getElementById("pw-input").focus();
    }
  }

  function unlock() {
    const gate = document.getElementById("auth-gate");
    if (gate) gate.remove();
    initApp();
  }

  checkAuth();
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, doc, getDoc, setDoc, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyArnMD-8q0InlTrHxRmvvKE5fx9dAn4PPQ",
    authDomain: "daggerheart-1db7f.firebaseapp.com",
    projectId: "daggerheart-1db7f",
    storageBucket: "daggerheart-1db7f.firebasestorage.app",
    messagingSenderId: "880963026113",
    appId: "1:880963026113:web:84697ee6ee18a2950fe840"
  };

  const DEFAULT_BG = "https://i.redd.it/g39kbyrmglpc1.jpeg";
  let db, mapRef, mapState = { bgUrl: DEFAULT_BG, tokens: {} }, dragging = null;
  let tokenCounter = 1;

  window.initApp = async function() {
    const app = initializeApp(firebaseConfig);
    db = getFirestore(app);
    mapRef = doc(db, "battlemap", "current");

    bindDragEvents();

    document.getElementById("set-bg-btn").onclick = async () => {
      const url = document.getElementById("bg-url").value.trim();
      mapState.bgUrl = url;
      renderBg();
      try { await updateDoc(mapRef, { bgUrl: url }); } catch {}
    };
    document.getElementById("load-party-btn").onclick = loadParty;
    document.getElementById("add-token-btn").onclick = () => addToken("player");
    document.getElementById("add-enemy-btn").onclick = () => addToken("enemy");
    document.getElementById("clear-btn").onclick = clearMap;

    try {
      const snap = await getDoc(mapRef);
      if (!snap.exists()) {
        await setDoc(mapRef, mapState);
      } else {
        mapState = { bgUrl: DEFAULT_BG, tokens: {}, ...snap.data() };
        if (!mapState.bgUrl) {
          mapState.bgUrl = DEFAULT_BG;
          await updateDoc(mapRef, { bgUrl: DEFAULT_BG });
        }
      }
      renderBg();
      renderTokens();
      document.getElementById("sync-status").textContent = "Synced ✓";

      onSnapshot(mapRef, (docSnap) => {
        if (docSnap.exists() && !dragging) {
          mapState = { bgUrl: "", tokens: {}, ...docSnap.data() };
          renderBg();
          renderTokens();
        }
      });
    } catch {
      document.getElementById("sync-status").textContent = "Offline — check connection";
      document.getElementById("sync-status").classList.add("error");
    }
  };

  function renderBg() {
    const img = document.getElementById("map-bg");
    if (mapState.bgUrl) { img.src = mapState.bgUrl; img.style.display = "block"; }
    else img.style.display = "none";
  }

  function renderTokens() {
    const canvas = document.getElementById("map-canvas");
    canvas.innerHTML = "";
    Object.entries(mapState.tokens || {}).forEach(([id, t]) => {
      const wrap = document.createElement("div");
      wrap.style.cssText = `position:absolute; left:${t.x ?? 50}px; top:${t.y ?? 50}px;`;
      const el = document.createElement("div");
      el.className = "token" + (t.type === "enemy" ? " enemy" : "");
      el.textContent = t.label || "?";
      el.dataset.id = id;
      const lbl = document.createElement("div");
      lbl.className = "token-label";
      lbl.textContent = t.name || "";
      wrap.appendChild(el);
      wrap.appendChild(lbl);
      attachDrag(wrap, el, id);
      canvas.appendChild(wrap);
    });
  }

  function attachDrag(wrap, el, id) {
    function startDrag(clientX, clientY) {
      const rect = document.getElementById("map-canvas").getBoundingClientRect();
      const tokenRect = wrap.getBoundingClientRect();
      dragging = { id, offsetX: clientX - tokenRect.left, offsetY: clientY - tokenRect.top, rect };
    }
    el.addEventListener("mousedown", (e) => { e.preventDefault(); startDrag(e.clientX, e.clientY); });
    el.addEventListener("touchstart", (e) => { const t = e.touches[0]; startDrag(t.clientX, t.clientY); }, { passive: true });
  }

  function bindDragEvents() {
    function move(clientX, clientY) {
      if (!dragging) return;
      const { id, offsetX, offsetY, rect } = dragging;
      let x = clientX - rect.left - offsetX;
      let y = clientY - rect.top - offsetY;
      x = Math.max(0, Math.min(rect.width - 48, x));
      y = Math.max(0, Math.min(rect.height - 48, y));
      if (!mapState.tokens[id]) return;
      mapState.tokens[id].x = x;
      mapState.tokens[id].y = y;
      const wrap = document.getElementById("map-canvas").querySelector(`[data-id="${id}"]`)?.parentElement;
      if (wrap) { wrap.style.left = x + "px"; wrap.style.top = y + "px"; }
    }
    async function endDrag() {
      if (!dragging) return;
      const { id } = dragging;
      const t = mapState.tokens[id];
      dragging = null;
      if (!t) return;
      try { await updateDoc(mapRef, { [`tokens.${id}.x`]: t.x, [`tokens.${id}.y`]: t.y }); } catch {}
    }
    window.addEventListener("mousemove", (e) => move(e.clientX, e.clientY));
    window.addEventListener("mouseup", endDrag);
    window.addEventListener("touchmove", (e) => { if (dragging) { const t = e.touches[0]; move(t.clientX, t.clientY); } }, { passive: true });
    window.addEventListener("touchend", endDrag);
  }

  async function loadParty() {
    const PARTY = [
      { name: "Tostadinator", label: "TOS" },
      { name: "Lola",         label: "LOL" },
      { name: "Maya",         label: "MAY" },
      { name: "Drew",         label: "DRW" },
      { name: "Oli",          label: "OLI" },
      { name: "Cal",          label: "CAL" },
      { name: "Caleb",        label: "CLB" },
      { name: "Paul",         label: "PUL" },
    ];
    const canvasWidth = document.getElementById("map-canvas").offsetWidth || 860;
    const spacing = Math.floor((canvasWidth - 80) / PARTY.length);
    const updates = {};
    PARTY.forEach((p, i) => {
      const id = "player-" + p.name.toLowerCase();
      if (mapState.tokens[id]) return; // don't overwrite existing token
      const token = { x: 40 + i * spacing, y: 520, label: p.label, name: p.name, type: "player" };
      mapState.tokens[id] = token;
      updates[`tokens.${id}`] = token;
    });
    renderTokens();
    if (Object.keys(updates).length) {
      try { await updateDoc(mapRef, updates); } catch {}
    }
  }

  async function addToken(type) {
    const label = prompt(`Name for this ${type} token?`, type === "enemy" ? "Enemy" : "Player");
    if (!label) return;
    const id = type + "-" + Date.now();
    const short = label.slice(0, 3).toUpperCase();
    mapState.tokens[id] = { x: 60 + tokenCounter * 10, y: 60 + tokenCounter * 10, label: short, name: label, type };
    tokenCounter++;
    renderTokens();
    try { await updateDoc(mapRef, { [`tokens.${id}`]: mapState.tokens[id] }); } catch {}
  }

  async function clearMap() {
    if (!confirm("Clear all tokens from the map?")) return;
    mapState.tokens = {};
    renderTokens();
    try { await updateDoc(mapRef, { tokens: {} }); } catch {}
  }
</script>
</body>
</html>
