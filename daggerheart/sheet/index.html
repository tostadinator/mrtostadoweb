---
layout: null
---
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Character Sheet — Daggerheart</title>
<style>
  body {
    margin: 0;
    font-family: 'Georgia', serif;
    background: radial-gradient(circle at top, #1b1330, #0a0712);
    color: #e8e2f5;
    padding: 24px;
  }
  .sheet { max-width: 480px; margin: 0 auto; }
  .back-link {
    display: inline-block; color: #9b8bbf; font-size: 13px;
    text-decoration: none; margin-bottom: 16px;
  }
  .back-link:hover { color: #c9a8ff; }

  /* Character picker */
  .char-picker { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
  .char-btn {
    padding: 7px 16px; border-radius: 999px; border: 2px solid #5b3e96;
    background: transparent; color: #9b8bbf; font-size: 13px; cursor: pointer;
    transition: all 0.15s;
  }
  .char-btn.active { background: #5b3e96; color: #e8e2f5; font-weight: bold; }
  .char-btn:hover { border-color: #c9a8ff; color: #c9a8ff; }

  .card {
    background: #1a1428; border: 2px solid #5b3e96; border-radius: 16px;
    padding: 20px; box-shadow: 0 0 30px rgba(120,80,220,0.3);
  }
  h1 { text-align: center; color: #c9a8ff; margin: 0 0 4px; font-size: 28px; }
  .subtitle { text-align: center; color: #9b8bbf; font-size: 14px; margin-bottom: 16px; }
  .sync-status { text-align: center; font-size: 12px; color: #7fdca0; margin-bottom: 12px; min-height: 16px; }
  .sync-status.error { color: #ff8a8a; }
  .section { margin-bottom: 16px; border-top: 1px solid #3a2a5c; padding-top: 12px; }
  .section-title { color: #c9a8ff; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
  .traits { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .trait { background: #241a3a; border-radius: 10px; padding: 8px; text-align: center; }
  .trait-name { font-size: 11px; color: #9b8bbf; }
  .trait-val { font-size: 20px; font-weight: bold; color: #ffffff; }
  .resource-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .resource-label { font-size: 14px; color: #d8cdf0; }
  .portrait-frame { display: flex; justify-content: center; margin: 10px 0 16px; }
  .portrait-img {
    width: 100%; max-width: 320px; border-radius: 12px;
    border: 2px solid #5b3e96; box-shadow: 0 0 24px rgba(170,120,255,0.45); display: block;
  }
  .pips { display: flex; gap: 6px; flex-wrap: wrap; }
  .pip {
    width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid #5b3e96; cursor: pointer; background: transparent;
    transition: all 0.15s;
  }
  .pip.filled { background: #c9a8ff; box-shadow: 0 0 8px #c9a8ff; }
  .feature { background: #241a3a; border-radius: 10px; padding: 10px; margin-bottom: 8px; font-size: 13px; line-height: 1.4; }
  .feature b { color: #c9a8ff; }
  .badge { display: inline-block; background: #3a2a5c; color: #c9a8ff; border-radius: 6px; padding: 2px 8px; font-size: 11px; margin-right: 4px; }

  /* Password gate */
  #auth-gate {
    position: fixed; inset: 0; z-index: 9999;
    background: radial-gradient(circle at top, #1b1330, #0a0712);
    display: flex; align-items: center; justify-content: center;
  }
  .gate-box { text-align: center; max-width: 320px; width: 100%; padding: 32px; }
  .gate-title { font-size: 32px; color: #c9a8ff; margin-bottom: 4px; }
  .gate-sub { font-size: 14px; color: #9b8bbf; margin-bottom: 28px; }
  .gate-input {
    width: 100%; box-sizing: border-box; padding: 12px 16px;
    border-radius: 10px; border: 2px solid #5b3e96;
    background: #1a1428; color: #e8e2f5; font-size: 16px;
    outline: none; margin-bottom: 12px;
  }
  .gate-input:focus { border-color: #c9a8ff; }
  .gate-btn {
    width: 100%; padding: 12px; border-radius: 10px; border: none;
    background: linear-gradient(135deg, #5b3e96, #8a5fc9);
    color: white; font-size: 15px; font-weight: bold; cursor: pointer;
  }
  .gate-error { color: #ff8a8a; font-size: 13px; margin-top: 10px; min-height: 18px; }
</style>
</head>
<body>

<div id="auth-gate">
  <div class="gate-box">
    <div class="gate-title">⚔️ Daggerheart</div>
    <div class="gate-sub">Character Sheet</div>
    <input class="gate-input" id="pw-input" type="password" placeholder="Team password" autocomplete="current-password">
    <button class="gate-btn" id="pw-btn">Enter</button>
    <div class="gate-error" id="pw-error"></div>
  </div>
</div>

<div class="sheet">
  <a href="../" class="back-link">← Back to Home</a>

  <div class="char-picker" id="char-picker"></div>

  <div class="card">
    <h1 id="char-name">—</h1>
    <div class="subtitle" id="char-subtitle">—</div>
    <div class="portrait-frame" id="char-portrait" style="display:none;">
      <img class="portrait-img" id="char-portrait-img" src="" alt="Character portrait">
    </div>
    <div class="sync-status" id="sync-status">Connecting...</div>

    <div class="section">
      <div class="section-title">Traits</div>
      <div class="traits" id="traits-grid"></div>
      <div id="stats-line" style="margin-top:10px; text-align:center; color:#9b8bbf; font-size:13px;"></div>
    </div>

    <div class="section">
      <div class="section-title">Resources (tap to mark — synced live)</div>
      <div class="resource-row">
        <div class="resource-label">Hit Points (marked)</div>
        <div class="pips" id="hp-pips"></div>
      </div>
      <div class="resource-row">
        <div class="resource-label">Stress (marked)</div>
        <div class="pips" id="stress-pips"></div>
      </div>
      <div class="resource-row">
        <div class="resource-label">Hope (current)</div>
        <div class="pips" id="hope-pips"></div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Ancestry & Community Features</div>
      <div id="features-list"></div>
    </div>

    <div class="section">
      <div class="section-title">Domains</div>
      <div id="domains-list"></div>
    </div>

  </div>
</div>

<script>
  const PASSWORD_HASH = "5bfa0151f57207a3c1688bebe2568444a943842d5e7c42b7d4d0742b6f12baa1";

  async function sha256(msg) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(msg));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,"0")).join("");
  }

  async function checkAuth() {
    const stored = localStorage.getItem("dh_auth");
    if (stored === PASSWORD_HASH) { unlock(); return; }
    document.getElementById("pw-btn").addEventListener("click", attemptLogin);
    document.getElementById("pw-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter") attemptLogin();
    });
  }

  async function attemptLogin() {
    const val = document.getElementById("pw-input").value;
    const hash = await sha256(val);
    if (hash === PASSWORD_HASH) {
      localStorage.setItem("dh_auth", hash);
      unlock();
    } else {
      document.getElementById("pw-error").textContent = "Wrong password — try again.";
      document.getElementById("pw-input").value = "";
      document.getElementById("pw-input").focus();
    }
  }

  function unlock() {
    const gate = document.getElementById("auth-gate");
    if (gate) gate.remove();
    if (typeof window.initApp === "function") window.initApp();
    // else: module auto-starts below
  }

  checkAuth();
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, doc, getDoc, setDoc, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyArnMD-8q0InlTrHxRmvvKE5fx9dAn4PPQ",
    authDomain: "daggerheart-1db7f.firebaseapp.com",
    projectId: "daggerheart-1db7f",
    storageBucket: "daggerheart-1db7f.firebasestorage.app",
    messagingSenderId: "880963026113",
    appId: "1:880963026113:web:84697ee6ee18a2950fe840"
  };

  // Stub list — names for the picker; full data is loaded from Firebase
  const CHARACTERS = [
    { docId: "tostadinator", name: "Tostadinator" },
    { docId: "lola",         name: "Lola"  },
    { docId: "maya",         name: "Maya"  },
    { docId: "drew",         name: "Drew"  },
    { docId: "oli",          name: "Oli"   },
    { docId: "cal",          name: "Cal"   },
    { docId: "caleb",        name: "Caleb" },
    { docId: "paul",         name: "Paul"  },
  ];

  const MAX_PIPS = 6;
  const DEFAULT_STATE = { hp: 0, stress: 0, hope: 2 };
  const DEFAULT_CHAR = {
    hp: 0, stress: 0, hope: 2,
    name: "", ancestry: "—", charClass: "—", portrait: "",
    evasion: 10, proficiency: 1, traits: [], features: [], domains: []
  };

  let db, charRef, currentState = { ...DEFAULT_STATE }, unsubscribe = null;
  let activeDocId = CHARACTERS[0].docId, started = false;

  window.initApp = async function() {
    if (started) return; started = true;
    const app = initializeApp(firebaseConfig);
    db = getFirestore(app);

    buildPicker();
    await selectCharacter(CHARACTERS[0].docId);
  };

  function buildPicker() {
    const picker = document.getElementById("char-picker");
    picker.innerHTML = "";
    CHARACTERS.forEach(c => {
      const btn = document.createElement("button");
      btn.className = "char-btn" + (c.docId === activeDocId ? " active" : "");
      btn.textContent = c.name;
      btn.onclick = () => selectCharacter(c.docId);
      picker.appendChild(btn);
    });
  }

  async function selectCharacter(docId) {
    if (unsubscribe) { unsubscribe(); unsubscribe = null; }
    activeDocId = docId;

    document.querySelectorAll(".char-btn").forEach(b => {
      const stub = CHARACTERS.find(c => c.docId === docId);
      b.classList.toggle("active", b.textContent === (stub?.name || docId));
    });

    charRef = doc(db, "characters", docId);
    const statusEl = document.getElementById("sync-status");
    statusEl.textContent = "Loading...";
    statusEl.classList.remove("error");

    try {
      const snap = await getDoc(charRef);
      let data;
      if (!snap.exists()) {
        await setDoc(charRef, DEFAULT_STATE);
        data = { ...DEFAULT_CHAR, name: CHARACTERS.find(c => c.docId === docId)?.name || docId };
      } else {
        data = { ...DEFAULT_CHAR, ...snap.data() };
      }
      renderStaticInfo(data);
      currentState = { hp: data.hp || 0, stress: data.stress || 0, hope: data.hope || 2 };
      renderPips();
      statusEl.textContent = "Synced ✓";
      statusEl.classList.remove("error");

      unsubscribe = onSnapshot(charRef, (docSnap) => {
        if (docSnap.exists()) {
          currentState = { hp: docSnap.data().hp || 0, stress: docSnap.data().stress || 0, hope: docSnap.data().hope || 2 };
          renderPips();
        }
      });
    } catch(e) {
      statusEl.textContent = e.message || "Offline — changes won't save";
      statusEl.classList.add("error");
      renderPips();
    }
  }

  function renderStaticInfo(char) {
    document.getElementById("char-name").textContent = char.name || char.docId || "—";
    document.getElementById("char-subtitle").textContent = `${char.ancestry || "—"} • ${char.charClass || "—"}`;
    const portraitFrame = document.getElementById("char-portrait");
    const portraitImg   = document.getElementById("char-portrait-img");
    if (char.portrait) {
      portraitImg.src = char.portrait;
      portraitFrame.style.display = "flex";
    } else {
      portraitFrame.style.display = "none";
    }
    document.getElementById("traits-grid").innerHTML = (char.traits || []).map(t =>
      `<div class="trait"><div class="trait-name">${t.name}</div><div class="trait-val">${t.val}</div></div>`
    ).join("");
    document.getElementById("stats-line").innerHTML =
      `Evasion: <span style="color:#c9a8ff;font-weight:bold;">${char.evasion ?? 10}</span> &nbsp;|&nbsp; Proficiency: <span style="color:#c9a8ff;font-weight:bold;">${char.proficiency ?? 1}</span>`;
    document.getElementById("features-list").innerHTML = (char.features || []).length
      ? char.features.map(f => `<div class="feature"><b>${f.name}:</b> ${f.desc}</div>`).join("")
      : `<div class="feature" style="color:#9b8bbf;font-style:italic;">No features listed yet.</div>`;
    document.getElementById("domains-list").innerHTML = (char.domains || []).length
      ? char.domains.map(d => `<span class="badge">${d}</span>`).join("") +
        `<div class="feature" style="margin-top:8px;"><i>Domain cards pending.</i></div>`
      : `<div class="feature" style="color:#9b8bbf;font-style:italic;">No domains listed yet.</div>`;
  }

  function renderPips() {
    buildPips("hp-pips", "hp");
    buildPips("stress-pips", "stress");
    buildPips("hope-pips", "hope");
  }

  function buildPips(containerId, key) {
    const container = document.getElementById(containerId);
    container.innerHTML = "";
    for (let i = 0; i < MAX_PIPS; i++) {
      const pip = document.createElement("div");
      pip.className = "pip" + (i < currentState[key] ? " filled" : "");
      pip.onclick = () => togglePip(key, i);
      container.appendChild(pip);
    }
  }

  async function togglePip(key, index) {
    const newVal = currentState[key] === index + 1 ? index : index + 1;
    currentState[key] = newVal;
    renderPips();
    const statusEl = document.getElementById("sync-status");
    try {
      await updateDoc(charRef, { [key]: newVal });
      statusEl.textContent = "Synced ✓";
      statusEl.classList.remove("error");
    } catch {
      statusEl.textContent = "Sync failed — check connection";
      statusEl.classList.add("error");
    }
  }

  if (!document.getElementById("auth-gate")) window.initApp();
</script>
</body>
</html>
